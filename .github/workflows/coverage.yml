name: Check coverage

on:
  workflow_dispatch:
    inputs:
      candidates:
        description: 'Which candidate file to test'
        required: true
        default: 'wi_candidates.txt'
        type: string

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Test which cities are on Legistar
        run: |
          echo "Testing ${{ inputs.candidates }}"
          echo "=================================================="
          python ops.py coverage --candidates "${{ inputs.candidates }}" \
            2>&1 | tee coverage-results.txt
          echo "=================================================="

      - name: Save results to the repo
        run: |
          git config user.name  "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add coverage-results.txt
          git diff --staged --quiet || \
            git commit -m "coverage check $(date -u +%F)"
          git push

      - name: Summary
        run: |
          {
            echo "## Coverage results"
            echo ""
            echo '```python'
            sed -n '/^CITIES = {/,/^}/p' coverage-results.txt
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
