name: Weekly water digest

on:
  schedule:
    - cron: '0 12 * * 1'   # Mondays 12:00 UTC = 7am Central
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      # Creates a DRAFT in Buttondown by default — it does not send.
      # To send unattended, add a repository Variable (not a secret)
      # named BUTTONDOWN_STATUS with the value: about_to_send
      - name: Build digest
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          BUTTONDOWN_STATUS: ${{ vars.BUTTONDOWN_STATUS }}
        run: |
          python ops.py run --days 14 2>&1 | tee run.log

      - name: Rebuild public page
        run: |
          python build_site.py
          test -s index.html || (echo "::error::index.html is empty"; exit 1)

      - name: Commit results
        run: |
          git config user.name  "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add state.json health.json digest.md index.html 2>/dev/null || true
          git diff --staged --quiet || git commit -m "digest $(date -u +%F)"
          git push

      # Pages needs a public repo or a paid plan. continue-on-error means
      # a Pages problem can never block the digest, which is the product.
      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: .
      - uses: actions/deploy-pages@v4
        continue-on-error: true

      # Runs last so a broken city surfaces without blocking anything above.
      - name: Fail loudly on health alarms
        if: always()
        run: |
          if grep -q "HEALTH ALARMS" run.log; then
            echo "::error::A tracked city stopped returning results."
            grep -A20 "HEALTH ALARMS" run.log
            exit 1
          fi
